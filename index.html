<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- DNS Prefetch & Preconnect for critical resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Primary Meta Tags -->
    <title>NextLevel - Companhia de Sistemas, Marketing & Performance</title>
    <meta name="title" content="NextLevel - Companhia de Sistemas, Marketing & Performance" />
    <meta name="description" content="Criamos landing pages e sites focados em conversão. Metodologia HOOK validada em +50 projetos. Entrega em até 7 dias." />
    <meta name="author" content="NextLevel" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Performance Meta Tags -->
    <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="x-dns-prefetch-control" content="on" />
    
    <!-- Mobile Web App Capable -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NextLevel" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://digital-hook-replica.lovable.app/" />
    <meta property="og:title" content="NextLevel - Companhia de Sistemas, Marketing & Performance" />
    <meta property="og:description" content="Criamos landing pages e sites focados em conversão. Metodologia HOOK validada em +50 projetos." />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="NextLevel" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NextLevel" />
    <meta name="twitter:title" content="NextLevel - Companhia de Sistemas, Marketing & Performance" />
    <meta name="twitter:description" content="Criamos landing pages e sites focados em conversão. Metodologia HOOK validada em +50 projetos." />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Critical Font Loading - Optimized with subset -->
    <link 
      rel="preload" 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" 
      as="style" 
      onload="this.onload=null;this.rel='stylesheet'" 
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    </noscript>
    
    <!-- Inline Critical CSS for Faster FCP/LCP -->
    <style>
      /* Critical CSS - Inline for instant rendering */
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
      body{margin:0;padding:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:#0B0B0B;color:#fff;line-height:1.5;overflow-x:hidden}
      #root{isolation:isolate;min-height:100vh;min-height:100dvh}
      h1,h2,h3,h4,h5,h6{margin:0;font-weight:700}
      h1{font-size:clamp(2rem,5vw,4.5rem);line-height:1.1;letter-spacing:-0.02em}
      img,video{max-width:100%;height:auto;display:block}
      a{color:inherit;text-decoration:none}
      button{font:inherit;cursor:pointer}
      /* Loading indicator */
      #root:empty::after{content:'';position:fixed;top:50%;left:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border:2px solid #333;border-top-color:#22c55e;border-radius:50%;animation:spin 0.8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      /* Prevent FOUT */
      .fonts-loading{opacity:0}
      .fonts-loaded{opacity:1;transition:opacity 0.2s ease-out}
    </style>
    
    <!-- Font Loading Detection -->
    <script>
      document.documentElement.className='fonts-loading';
      if('fonts' in document){
        Promise.all([
          document.fonts.load('400 1em Inter'),
          document.fonts.load('700 1em Inter')
        ]).then(function(){
          document.documentElement.className='fonts-loaded';
        });
      }else{
        document.documentElement.className='fonts-loaded';
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
